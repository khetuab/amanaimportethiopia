workflows:
  ios-release:
    name: Mobile iOS Release
    working_directory: mobile
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ethio_apple_key_one
    environment:
      groups:
        - ios_credentials
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.ethiopia.ethioimport
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Apply signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true