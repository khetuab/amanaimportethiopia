workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: "App Store Connect Key"
    environment:
      groups:
        - app_env
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ethiopia.ethioimport
      vars:
        APP_STORE_APPLE_ID: 6835421184
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create .env file
        script: |
          echo "$ENV_FILE_BASE64" | base64 --decode > .env
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          NEXT=$((BUILD + 1))
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true